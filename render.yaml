services:
  - type: web
    name: arkguess-server
    runtime: docker
    repo: https://github.com/d1n0SAur404/ARK-CODE
    plan: free
    rootDir: server
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: HOST
        value: "0.0.0.0"
      - key: CORS_ORIGIN
        value: "true"
