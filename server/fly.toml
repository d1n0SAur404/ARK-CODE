# ============================================
# Fly.io 配置 — ARK CODE Server
# 部署命令: fly deploy
# ============================================

app = "arkcode-server"
primary_region = "hkg"  # 香港，對中國大陸最優

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

# 扩展到 2 实例时取消注释
