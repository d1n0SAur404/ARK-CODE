app = "arkguess-server"
primary_region = "hkg"

[build]
  image = "node:22-alpine"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  CORS_ORIGIN = "true"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    method = "get"
    path = "/health"
    grace_period = "10s"
